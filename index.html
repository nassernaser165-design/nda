<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Hacked Screen</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: black;
  overflow: hidden;
  font-family: monospace;
  color: #00ff00;
  cursor: pointer;
}

/* ===== مطر قوي وواضح ===== */
body::before,
body::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

body::before {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(0,255,0,0.45) 0px,
    rgba(0,255,0,0.45) 2px,
    transparent 2px,
    transparent 6px
  );
  animation: rain 0.12s linear infinite;
  z-index: 1;
}

body::after {
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(0,255,0,0.2) 0px,
    rgba(0,255,0,0.2) 1px,
    transparent 1px,
    transparent 4px
  );
  animation: rain 0.07s linear infinite;
  z-index: 2;
}

@keyframes rain {
  from { background-position-y: 0; }
  to   { background-position-y: 500px; }
}

/* ===== العنوان ===== */
h1 {
  position: relative;
  z-index: 3;
  text-align: center;
  margin-top: 40px;
  color: red;
  font-size: 42px;
  text-shadow: 0 0 15px red;
}

/* ===== الصورة بالوسط ===== */
.center-image {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

.center-image img {
  width: 320px;
  border-radius: 20px;
  border: 4px solid #00ff00;
  box-shadow: 0 0 30px #00ff00;
}

/* ===== اختيار صورة ===== */
input[type="file"] {
  margin-top: 15px;
  color: white;
}

/* ===== ملاحظة ===== */
.note {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  color: #ccc;
  font-size: 14px;
  z-index: 3;
}
</style>
</head>

<body>

<h1>Hacked By ناصر العتيبي</h1>

<div class="center-image">
  <img id="preview" src="Screenshot 2026-01-11 024538.png" alt="image">
  <br>
  <input type="file" accept="image/*" onchange="changeImage(this)">
</div>

<div class="note">
  اضغط أي مكان لتشغيل الصوت
</div>

<audio id="music" loop>
  <source src="Nightcore - I'm So Lonely Broken Angel.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("music");

/* تشغيل الصوت عند أول ضغطة */
document.addEventListener("click", () => {
  audio.volume = 1;
  audio.play();
}, { once: true });

/* تغيير الصورة */
function changeImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById("preview").src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>

</body>
</html>
